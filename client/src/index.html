<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Don't Touch The Purple</title>
    <meta
      name="description"
      content="A real-time multiplayer reflex game for up to 10 players. One tile lights up at a time — tap it to score, but don't touch the purple. Create a room and challenge your friends live."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="shortcut icon" href="favicon.ico" />

    <!-- "Add to Home Screen" support: iOS Safari has no Fullscreen API at all
         (not even for Chrome-for-iOS, since every iOS browser is required to
         use WebKit under the hood), so a chrome-less standalone launch via a
         home-screen icon is the closest thing to fullscreen iPhone allows. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Don't Touch Purple" />
    <meta name="theme-color" content="#000000" />

    <!-- Open Graph / link preview (WhatsApp, Slack, iMessage, Discord, Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Don't Touch The Purple" />
    <meta property="og:url" content="https://donttouchpurple-av.vercel.app/" />
    <meta property="og:title" content="Don't Touch The Purple 🟣" />
    <meta
      property="og:description"
      content="A real-time multiplayer reflex game for up to 10 players. One tile lights up at a time — tap it to score, but don't touch the purple."
    />
    <meta property="og:image" content="https://donttouchpurple-av.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Don't Touch The Purple 🟣" />
    <meta
      name="twitter:description"
      content="A real-time multiplayer reflex game for up to 10 players. One tile lights up at a time — tap it to score, but don't touch the purple."
    />
    <meta name="twitter:image" content="https://donttouchpurple-av.vercel.app/og-image.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
